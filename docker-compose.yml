services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # limiter state is ephemeral
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "synchronous_commit=off", "-c", "max_wal_size=2GB",
              "-c", "checkpoint_timeout=15min", "-c", "shared_buffers=256MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 15

  gateway:
    build: .
    container_name: gateway
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      GW_PROVIDER_A_URL: ${GW_PROVIDER_A_URL}
      GW_PROVIDER_B_URL: ${GW_PROVIDER_B_URL}
      GW_PROVIDER_C_URL: ${GW_PROVIDER_C_URL}
      GW_WRITER_ENABLED: ${GW_WRITER_ENABLED}
      GW_REDIS_URL: redis://redis:6379/0
      GW_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

volumes:
  pgdata: