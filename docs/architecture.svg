<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#555;stroke-width:1.2;rx:6}
      .gw{fill:#f3f7fb;stroke:#2f6fa8;stroke-width:1.6;rx:10}
      .ext{fill:#fff7e6;stroke:#b7791f;stroke-width:1.4;rx:8}
      .store{fill:#eef8ee;stroke:#2f855a;stroke-width:1.4;rx:8}
      .t{fill:#222}.s{fill:#555;font-size:11px}.h{font-weight:bold;fill:#1a3d5c;font-size:14px}
      .l{stroke:#444;stroke-width:1.4;fill:none}.d{stroke:#444;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1040" height="640" fill="#fff"/>
  <text x="20" y="28" class="h" font-size="18">Provider Gateway: architecture and request flow</text>

  <!-- Client -->
  <rect class="ext" x="20" y="290" width="110" height="64"/>
  <text x="75" y="318" text-anchor="middle" class="t">Clients</text>
  <text x="75" y="336" text-anchor="middle" class="s">POST /v1/process</text>

  <!-- Gateway container -->
  <rect class="gw" x="170" y="50" width="520" height="560"/>
  <text x="190" y="75" class="h">Gateway instance (FastAPI, async) — N replicas behind a load balancer</text>

  <rect class="box" x="195" y="90" width="470" height="52"/>
  <text x="210" y="112" class="t">1. TraceIdMiddleware</text>
  <text x="210" y="130" class="s">reuse/create X-Trace-Id · ContextVar for logs · one JSON access-log line per request</text>

  <rect class="box" x="195" y="160" width="470" height="52"/>
  <text x="210" y="182" class="t">2. Ingress protection</text>
  <text x="210" y="200" class="s">token bucket per instance → 429 · in-flight cap → fast 503 + Retry-After (load shedding)</text>

  <rect class="box" x="195" y="230" width="470" height="62"/>
  <text x="210" y="252" class="t">3. Router</text>
  <text x="210" y="270" class="s">A first, then B/C by latency×load · ≤3 attempts · full-jitter backoff · failover · 25s deadline</text>

  <rect class="box" x="195" y="310" width="225" height="62"/>
  <text x="207" y="332" class="t">Circuit breaker (per provider)</text>
  <text x="207" y="350" class="s">closed → open → half-open probe</text>

  <rect class="box" x="440" y="310" width="225" height="62"/>
  <text x="452" y="332" class="t">Limiter for Provider A</text>
  <text x="452" y="350" class="s">Redis token bucket (Lua) + local fallback</text>

  <rect class="box" x="195" y="390" width="470" height="52"/>
  <text x="210" y="412" class="t">4. Provider clients (shared httpx pool)</text>
  <text x="210" y="430" class="s">per-provider timeout and concurrency cap · classify 429 / 5xx / timeout / network</text>

  <rect class="box" x="195" y="470" width="225" height="62"/>
  <text x="207" y="492" class="t">5. Audit queue (bounded)</text>
  <text x="207" y="510" class="s">non-blocking submit · drop+count if full</text>

  <rect class="box" x="440" y="470" width="225" height="62"/>
  <text x="452" y="492" class="t">Batch writer (background)</text>
  <text x="452" y="510" class="s">COPY ≤1000 rows / 0.5s · retries</text>

  <rect class="box" x="195" y="552" width="470" height="42"/>
  <text x="210" y="572" class="t">/metrics (Prometheus) · /health · JSON logs → stdout</text>
  <text x="210" y="587" class="s">trace_id in every log line, response header and DB row</text>

  <!-- External providers -->
  <rect class="ext" x="780" y="80" width="230" height="56"/>
  <text x="795" y="102" class="t">Provider A</text>
  <text x="795" y="120" class="s">300–1000ms · strict rate limit (429)</text>
  <rect class="ext" x="780" y="150" width="230" height="56"/>
  <text x="795" y="172" class="t">Provider B</text>
  <text x="795" y="190" class="s">1–10s · 5xx · timeouts</text>
  <rect class="ext" x="780" y="220" width="230" height="56"/>
  <text x="795" y="242" class="t">Provider C</text>
  <text x="795" y="260" class="s">1–10s · 5xx · timeouts</text>

  <!-- Redis, Postgres, Prometheus -->
  <rect class="store" x="780" y="320" width="230" height="56"/>
  <text x="795" y="342" class="t">Redis</text>
  <text x="795" y="360" class="s">shared token bucket for A (all replicas)</text>
  <rect class="store" x="780" y="470" width="230" height="62"/>
  <text x="795" y="492" class="t">PostgreSQL</text>
  <text x="795" y="510" class="s">requests table, daily partitions</text>
  <text x="795" y="524" class="s">+ BRIN(created_at), btree(trace_id)</text>
  <rect class="store" x="780" y="552" width="230" height="42"/>
  <text x="795" y="578" class="t">Prometheus / log collector</text>

  <!-- Arrows -->
  <path class="l" d="M130,322 L170,322" marker-end="url(#arr)"/>
  <path class="l" d="M430,142 L430,160" marker-end="url(#arr)"/>
  <path class="l" d="M430,212 L430,230" marker-end="url(#arr)"/>
  <path class="l" d="M300,292 L300,310" marker-end="url(#arr)"/>
  <path class="l" d="M550,292 L550,310" marker-end="url(#arr)"/>
  <path class="l" d="M430,372 L430,390" marker-end="url(#arr)"/>
  <path class="l" d="M665,416 L725,416 L725,108 L780,108" marker-end="url(#arr)"/>
  <path class="l" d="M725,178 L780,178" marker-end="url(#arr)"/>
  <path class="l" d="M725,248 L780,248" marker-end="url(#arr)"/>
  <path class="l" d="M665,341 L780,348" marker-end="url(#arr)"/>
  <path class="d" d="M300,442 L300,470" marker-end="url(#arr)"/>
  <path class="l" d="M420,501 L440,501" marker-end="url(#arr)"/>
  <path class="l" d="M665,501 L780,501" marker-end="url(#arr)"/>
  <path class="d" d="M665,573 L780,573" marker-end="url(#arr)"/>
  <text x="20" y="400" class="t" font-size="12" font-weight="bold">Responses</text>
  <text x="20" y="418" class="s">Success: provider reply</text>
  <text x="20" y="432" class="s">+ trace_id, provider_used,</text>
  <text x="20" y="446" class="s">attempts.</text>
  <text x="20" y="466" class="s">Providers exhausted:</text>
  <text x="20" y="480" class="s">503 + Retry-After.</text>
  <text x="20" y="500" class="s">Own limits: 429 / 503.</text>
</svg>
